apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: FIXORA_NAMESPACE
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-repair
  template:
    metadata:
      labels:
        app: hpa-repair
    spec:
      containers:
        - name: app
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "while true; do sleep 1; done"]
