apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  labels:
    app: missing-config-demo
data:
  some-key: "hello from fixora"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: missing-config-demo
  labels:
    app: missing-config-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: missing-config-demo
  template:
    metadata:
      labels:
        app: missing-config-demo
    spec:
      containers:
      - name: config-consumer
        image: public.ecr.aws/docker/library/busybox:1.36
        command: ["sh", "-c", "echo Value: $REQUIRED_ENV; sleep 3600"]
        env:
        - name: REQUIRED_ENV
          valueFrom:
            configMapKeyRef:
              # Typo: the real ConfigMap above is named app-config. A mistyped
              # reference is a realistic failure the env inferrer can correct,
              # unlike a genuinely absent Secret, which no patch can create and
              # which shadow refuses to verify at all.
              name: app-confg
              key: some-key
