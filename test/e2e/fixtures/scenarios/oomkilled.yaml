apiVersion: apps/v1
kind: Deployment
metadata:
  name: oomkilled-demo
  labels:
    app: oomkilled-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oomkilled-demo
  template:
    metadata:
      labels:
        app: oomkilled-demo
    spec:
      containers:
      - name: memory-hog
        image: public.ecr.aws/docker/library/busybox:1.36
        # Write past the 32Mi limit so the kernel OOM-kills the container, but
        # keep the write small enough that a right-sized limit lets it succeed,
        # and sleep afterwards so a fixed container stays Running and Ready.
        # Without the sleep the container exits 0 and restart-loops, so no
        # memory patch could ever make the Deployment available.
        command: ["sh", "-c", "dd if=/dev/zero of=/cache/fill bs=1M count=64; sleep 3600"]
        resources:
          limits:
            memory: "32Mi"
        volumeMounts:
        - name: cache
          mountPath: /cache
      volumes:
      - name: cache
        emptyDir:
          medium: Memory
