apiVersion: apps/v1
kind: Deployment
metadata:
  name: oomkilled-demo
  labels:
    app: oomkilled-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oomkilled-demo
  template:
    metadata:
      labels:
        app: oomkilled-demo
    spec:
      containers:
      - name: memory-hog
        image: public.ecr.aws/docker/library/busybox:1.36
        # Write far past the memory limit into a Memory-medium emptyDir, which
        # counts against the container's cgroup limit, so the kernel OOM-kills
        # the container. Deterministic and uses an image the suite already
        # pulls (polinux/stress lives only on Docker Hub, which rate-limits CI).
        command: ["sh", "-c", "dd if=/dev/zero of=/cache/fill bs=1M count=256"]
        resources:
          limits:
            memory: "32Mi"
        volumeMounts:
        - name: cache
          mountPath: /cache
      volumes:
      - name: cache
        emptyDir:
          medium: Memory
