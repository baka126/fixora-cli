apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-demo
  labels:
    app: security-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: security-demo
  template:
    metadata:
      labels:
        app: security-demo
    spec:
      containers:
      - name: restricted-app
        image: public.ecr.aws/docker/library/alpine:3.20
        command: ["sh", "-c", "echo writing to cache...; mkdir -p /var/cache/app && touch /var/cache/app/data.tmp; echo done; sleep 3600"]
        securityContext:
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
