apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-demo
  labels:
    app: pending-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pending-demo
  template:
    metadata:
      labels:
        app: pending-demo
    spec:
      containers:
      - name: greedy-container
        image: public.ecr.aws/docker/library/busybox:1.36
        command: ["sleep", "3600"]
        resources:
          requests:
            cpu: "100"
            memory: "100Gi"
