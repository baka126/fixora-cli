apiVersion: v1
kind: Namespace
metadata:
  name: fixora-np-e2e
  labels:
    environment: e2e
    fixora.io/networkpolicy-e2e: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: fixora-np-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-policy
  namespace: fixora-np-e2e
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
