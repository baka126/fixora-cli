apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: edge-workers
spec:
  selector:
    matchLabels: {component: arbitrary-api}
  template:
    metadata:
      labels: {component: arbitrary-api}
    spec:
      containers:
      - name: web-process
        image: public.ecr.aws/docker/library/busybox:1.36
        command: [sh, -c]
        args: ["mkdir -p /tmp/www; echo ready > /tmp/www/ready; exec httpd -f -p 8080 -h /tmp/www"]
        ports:
        - {name: app-web, containerPort: 8080}
        readinessProbe:
          httpGet: {path: /ready, port: app-web}
          initialDelaySeconds: 1
          periodSeconds: 1
---
apiVersion: v1
kind: Service
metadata:
  name: routing-entry
spec:
  selector: {component: deliberately-wrong}
  ports:
  - {name: client, port: 80, targetPort: 9090}
