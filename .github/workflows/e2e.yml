name: E2E

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e:
    name: Safety gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true

      - name: Run safety-gate e2e suite with NetworkPolicy-enforcing CNI
        env:
          FIXORA_E2E_TIMEOUT: 30m
        run: ./hack/e2e-shadow-isolation.sh
